<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RestockRadar</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 13px;
        color: #1c1917;
        background: #fffbea;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f5f5f4;
          background: #0c0a09;
        }
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
        color: #946c08;
      }
      .preview {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 10px;
      }
      .preview img {
        width: 48px;
        height: 48px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #d6bc4a;
        flex-shrink: 0;
      }
      .preview .url {
        font-size: 11px;
        color: #78716c;
        word-break: break-all;
      }
      label {
        display: block;
        font-size: 11px;
        color: #78716c;
        margin-top: 8px;
      }
      input, select {
        width: 100%;
        box-sizing: border-box;
        padding: 5px 6px;
        margin-top: 2px;
        border: 1px solid #d6bc4a;
        border-radius: 4px;
        font-size: 13px;
        background: white;
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        input, select {
          background: #1c1917;
          border-color: #5e4404;
        }
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 7px;
        border: none;
        border-radius: 4px;
        background: #946c08;
        color: white;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.secondary {
        background: transparent;
        color: #78716c;
        text-decoration: underline;
        margin-top: 4px;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
      }
      #status.error { color: #dc2626; }
      #status.success { color: #15803d; }
      details {
        margin-top: 10px;
      }
      details summary {
        font-size: 11px;
        color: #78716c;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>RestockRadar</h1>

    <div class="preview">
      <img id="preview-image" hidden alt="" />
      <div>
        <div id="preview-title">Reading page…</div>
        <div id="preview-url" class="url"></div>
      </div>
    </div>

    <label for="label">Product name</label>
    <input id="label" type="text" />

    <label for="product">Watchlist item</label>
    <select id="product"></select>

    <div style="display:flex; gap:8px;">
      <div style="flex:1;">
        <label for="price">Price (optional)</label>
        <input id="price" type="number" step="0.01" min="0" placeholder="4.48" />
      </div>
      <div style="flex:1;">
        <label for="currency">Currency</label>
        <input id="currency" type="text" placeholder="USD" />
      </div>
    </div>

    <div style="display:flex; gap:8px;">
      <div style="flex:1;">
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" step="any" min="0" placeholder="80" />
      </div>
      <div style="flex:1;">
        <label for="quantity-unit" title="The literal unit the quantity is in — a case of 12oz cans and a 2-liter bottle both just have &quot;a quantity&quot; without this">Unit</label>
        <input id="quantity-unit" type="text" placeholder="fl oz, ct, l…" />
      </div>
    </div>

    <label for="rank">Slot</label>
    <select id="rank">
      <option value="1">First choice</option>
      <option value="2">Backup #1</option>
      <option value="3">Backup #2</option>
      <option value="4">Backup #3</option>
      <option value="5">Backup #4</option>
    </select>

    <button id="save">Save to watchlist</button>
    <div id="status"></div>

    <details>
      <summary>Backend settings</summary>
      <label for="backend-url">RestockRadar API URL</label>
      <input id="backend-url" type="text" placeholder="http://localhost:8734/api" />
      <label for="api-token">API token</label>
      <input id="api-token" type="password" placeholder="paste from Settings → API tokens" />
      <button id="save-settings" class="secondary">Save settings</button>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
